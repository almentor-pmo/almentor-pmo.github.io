<body>
<div class="gate" id="gate" hidden>
  <form id="login" autocomplete="on">
    <img src="{{LOGO}}" alt="almentor">
    <h1>Quality Dashboard</h1>
    <p>Sign in with the Quality team account to see live review results.</p>
    <label for="u">Username<input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" required></label>
    <label for="pw">Password<input type="password" id="pw" name="password" autocomplete="current-password" required></label>
    <label class="rem" for="keep"><input type="checkbox" id="keep" checked> Keep me signed in on this device</label>
    <div class="err" id="lerr" role="alert"></div>
    <button type="submit" id="lbtn">Sign in</button>
  </form>
</div>
<header class="mast" id="mast">
  <div class="wrap">
    <img class="logo" alt="almentor" src="{{LOGO}}">
    <div class="title"><b>Quality Dashboard</b><span>Content Production · Quality Assurance</span></div>
    <div class="spacer"></div>
    <div class="sync"><span id="sync"><span class="pill stale"><span class="dot"></span>Connecting…</span></span><button class="rbtn" id="refresh" type="button" title="Pull the latest data from the Quality Tracking sheet now"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.6 2.4v3.8H9.8M2.4 13.6V9.8h3.8M3.1 6.2a5.2 5.2 0 0 1 9.6-1.6l.9 1.6M12.9 9.8a5.2 5.2 0 0 1-9.6 1.6l-.9-1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Refresh</button></div>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs" aria-label="Views"><div class="wrap" role="tablist">
    <button class="tab" role="tab" data-v="overview">Overview</button>
    <button class="tab" role="tab" data-v="teams">Teams</button>
    <button class="tab" role="tab" data-v="repeated">Repeated issues</button>
    <button class="tab" role="tab" data-v="projects">Projects</button>
    <button class="tab" role="tab" data-v="courses">Courses</button>
    <button class="tab" role="tab" data-v="qa">QA team</button>
    <button class="tab" role="tab" data-v="log">Issue log</button>
    <button class="tab" role="tab" data-v="alerts">Alerts <span class="tbadge" id="abadge" hidden></span></button>
  </div></nav>
</header>
<section class="slicers" aria-label="Filters"><div class="wrap">
  <div class="group"><span class="sl-label">Year</span><div class="seg" id="years"></div></div>
  <div class="group"><span class="sl-label">Month</span><div class="months" id="months"></div></div>
  <div class="group" id="msHost"></div>
  <button class="link reset" id="reset" hidden>Reset filters</button>
</div></section>
<main class="wrap" id="main">
  <div class="view" id="loading">
    <div class="kpis"><div class="skel" style="height:96px"></div><div class="skel" style="height:96px"></div><div class="skel" style="height:96px"></div><div class="skel" style="height:96px"></div></div>
    <div class="skel" style="height:340px"></div>
    <p class="muted" style="text-align:center;margin:0" id="loadmsg">Loading the latest sync of the Quality Tracking sheet…</p>
  </div>
  <div class="view" id="v-overview" hidden></div>
  <div class="view" id="v-teams" hidden></div>
  <div class="view" id="v-repeated" hidden></div>
  <div class="view" id="v-projects" hidden></div>
  <div class="view" id="v-courses" hidden></div>
  <div class="view" id="v-qa" hidden></div>
  <div class="view" id="v-log" hidden></div>
  <div class="view" id="v-alerts" hidden></div>
  <div class="foot" id="foot"></div>
</main>
<div id="drawerHost"></div>
<script src="../vendor/chart.umd.js"></script>
<script>
const LOGO="{{LOGO}}";
{{JS}}
</script>
</body>
</html>
