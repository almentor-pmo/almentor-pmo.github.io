<body>
<div class="gate" id="gate" hidden>
  <form id="login" autocomplete="on">
    <img src="{{LOGO}}" alt="almentor">
    <h1>Costing &amp; Quotes</h1>
    <p>Sign in with the BD team account to build quotes.</p>
    <label for="u">Username<input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" required></label>
    <label for="pw">Password<input type="password" id="pw" name="password" autocomplete="current-password" required></label>
    <label class="rem" for="keep"><input type="checkbox" id="keep" checked> Keep me signed in on this device</label>
    <div class="err" id="lerr" role="alert"></div>
    <button type="submit" id="lbtn">Sign in</button>
  </form>
</div>
<header class="mast" id="mast">
  <div class="wrap">
    <img class="logo" alt="almentor" src="{{LOGO}}">
    <div class="title"><b>Costing &amp; Quotes</b><span>Business Development · Pricing</span></div>
    <div class="spacer"></div>
    <div class="sync"><span id="sync"><span class="pill stale"><span class="dot"></span>Connecting…</span></span><button class="rbtn" id="refresh" type="button" title="Pull the latest prices from the Excel price list now"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.6 2.4v3.8H9.8M2.4 13.6V9.8h3.8M3.1 6.2a5.2 5.2 0 0 1 9.6-1.6l.9 1.6M12.9 9.8a5.2 5.2 0 0 1-9.6 1.6l-.9-1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Refresh prices</button></div>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs" aria-label="Views"><div class="wrap" role="tablist">
    <button class="tab" role="tab" data-v="quotes">Quotes</button>
    <button class="tab" role="tab" data-v="edit" id="tabEdit">New quote</button>
    <button class="tab" role="tab" data-v="prices">Price list</button>
  </div></nav>
</header>
<main class="wrap" id="main">
  <div class="view" id="loading">
    <div class="skel" style="height:120px"></div><div class="skel" style="height:340px"></div>
    <p class="muted" style="text-align:center;margin:0" id="loadmsg">Loading the price list…</p>
  </div>
  <div class="view" id="v-quotes" hidden></div>
  <div class="view" id="v-edit" hidden></div>
  <div class="view" id="v-prices" hidden></div>
  <div class="foot" id="foot"></div>
</main>
<div id="print" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const LOGO="{{LOGO}}";
{{JS}}
</script>
</body>
</html>
