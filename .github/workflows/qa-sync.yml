name: Sync Quality dashboard  # https://almentor-pmo.github.io/quality/

on:
  schedule:
    - cron: "37 * * * *"        # every hour (GitHub may start it a few minutes late)
  workflow_dispatch:            # "Refresh" button on the dashboard
    inputs:
      request_id:
        description: "Lets the dashboard know when its request finished"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["scripts/qa_sync.py", "scripts/qa_page/**", ".github/workflows/qa-sync.yml"]

permissions:
  contents: write

concurrency:
  group: qa-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet openpyxl==3.1.5 cryptography==43.0.3 requests==2.32.3

      - name: Build page, pull Excel, encrypt
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python scripts/qa_page/build.py
          python scripts/qa_sync.py

      - name: Publish (commit to main, GitHub Pages serves it)
        run: |
          git config user.name "almentor-pmo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality/ data/qa/
          if ! git diff --cached --quiet; then
            git commit -q -m "QA sync $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 3; done
          fi
