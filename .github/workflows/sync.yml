name: Sync from Excel  # hourly PMO dashboard sync

on:
  schedule:
    - cron: "7 * * * *"        # every hour (GitHub may start it a few minutes late)
  workflow_dispatch:           # "Refresh" button and project-manager edits in the dashboard
    inputs:
      changes:
        description: "Project-manager changes (JSON, sent by the dashboard)"
        required: false
        default: ""
      request_id:
        description: "Lets the dashboard know when its request finished"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["index.html", "keys.json", "scripts/**", ".github/workflows/sync.yml"]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet openpyxl==3.1.5 cryptography==43.0.3 requests==2.32.3

      - name: Pull Excel, apply PM changes, encrypt
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          CHANGES: ${{ inputs.changes }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python scripts/sync.py

      - name: Publish (commit to main, GitHub Pages serves it)
        run: |
          cp site/data.enc site/status.json .
          git config user.name "almentor-pmo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ data.enc status.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Sync $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 3; done
          fi
