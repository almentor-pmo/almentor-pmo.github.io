<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>almentor Quality Dashboard</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: black almentor masthead → one-row slicer bar → tabbed views (overview, projects, PMs, sheet, slides). */
:root{
  --ink:#0A0B0C; --red:#FF0000; --red-soft:#FFE5E5;
  --bg:#F4F6F6; --surface:#FFFFFF; --surface-2:#EEF1F1; --line:#DDE3E4;
  --fg:#0E1314; --fg-2:#46575B; --fg-3:#7B8B8F;
  --planned:#9DB2B7; --actual:#FF0000; --grid:#E6EBEC; --cin:#0F5C6B;
  --good:#11865B; --good-bg:#E3F4EC; --warn:#B26A00; --warn-bg:#FFF2DC; --bad:#C81E1E; --bad-bg:#FDE7E7;
  --mast:#0A0B0C; --mast-fg:#FFFFFF; --mast-2:#9AA9AC;
  --shadow:0 1px 2px rgba(10,20,22,.06),0 4px 16px rgba(10,20,22,.05);
  --f-ui:"Inter","Noto Kufi Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060E10; --surface:#0D181B; --surface-2:#132226; --line:#1F3237;
  --fg:#ECF1F2; --fg-2:#A7B7BA; --fg-3:#6E8286; --red-soft:#3A1012;
  --planned:#4C6A71; --actual:#FF2D2D; --grid:#17272B; --cin:#4FB3C4;
  --good:#3CCB8E; --good-bg:#0F2E22; --warn:#F2B04A; --warn-bg:#33240B; --bad:#FF6B6B; --bad-bg:#3A1416;
  --mast:#000000; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060E10; --surface:#0D181B; --surface-2:#132226; --line:#1F3237;
  --fg:#ECF1F2; --fg-2:#A7B7BA; --fg-3:#6E8286; --red-soft:#3A1012;
  --planned:#4C6A71; --actual:#FF2D2D; --grid:#17272B; --cin:#4FB3C4;
  --good:#3CCB8E; --good-bg:#0F2E22; --warn:#F2B04A; --warn-bg:#33240B; --bad:#FF6B6B; --bad-bg:#3A1416;
  --mast:#000000; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-ui);font-feature-settings:"tnum" 1,"cv11" 1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mast)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1480px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ar{font-family:"Noto Kufi Arabic",var(--f-ui)}

/* masthead */
.mast{background:var(--mast);color:var(--mast-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.mast .wrap{display:flex;align-items:center;gap:18px;padding-block:12px;flex-wrap:wrap}
.logo{height:26px;width:auto;display:block}
.mast .title{display:flex;flex-direction:column;gap:1px;padding-left:18px;border-left:1px solid #2A3336}
.mast .title b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.mast .title span{font-size:11px;color:var(--mast-2);letter-spacing:.06em;text-transform:uppercase}
.mast .spacer{flex:1}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mast-2);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.live{background:#0F2E22;color:#3CCB8E}
.pill.stale{background:#33240B;color:#F2B04A}
.pill.off{background:#2A1416;color:#FF8A8A}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live .dot{animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pill.live .dot{animation:none}}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mast-2)}
.avatar{width:28px;height:28px;border-radius:50%;background:#1C2629;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}

/* tabs */
.tabs{background:var(--mast);border-top:1px solid #1A2225}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;color:var(--mast-2);padding:12px 14px 11px;font-weight:600;font-size:13px;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--red)}

/* slicers */
.slicers{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--mastH,104px));z-index:15}
.slicers .wrap{display:flex;gap:10px 14px;align-items:center;padding-block:10px;flex-wrap:wrap}
.sl-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.months{display:flex;gap:3px;flex-wrap:wrap}
.months button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 7px;font-size:12px;font-weight:600;color:var(--fg-2);min-width:38px}
.months button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
:root[data-theme="dark"] .months button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .months button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}}
.months button.cur{box-shadow:inset 0 -2px 0 var(--red)}
.months button:disabled{opacity:.35;cursor:not-allowed}
.group{display:flex;align-items:center;gap:8px}
.ms{position:relative}
.ms>button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;max-width:220px}
.ms>button .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms>button.on{border-color:var(--fg);}
.ms>button svg{flex:none;opacity:.6}
.pop{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.18);width:280px;max-width:calc(100vw - 32px);z-index:40;padding:8px}
.pop input[type=search]{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 9px;margin-bottom:6px}
.pop .list{max-height:280px;overflow:auto}
.pop label{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:6px;font-size:13px;cursor:pointer}
.pop label:hover{background:var(--surface-2)}
.pop input[type=checkbox]{accent-color:var(--red)}
.pop .acts{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.link{background:none;border:0;color:var(--fg-2);font-size:12px;font-weight:600;padding:4px 6px}
.link:hover{color:var(--red)}
.reset{margin-left:auto}

/* views */
main{padding-block:20px 48px}
.view{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.card .sub{font-size:12px;color:var(--fg-3);margin-top:2px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.grid-3-1{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:980px){.grid-3-1{grid-template-columns:1fr}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .d{font-size:12px;color:var(--fg-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi.hero{background:var(--ink);border-color:var(--ink);color:#fff}
.kpi.hero .k{color:#9AA9AC}.kpi.hero .d{color:#C9D3D5}
.kpi.hero .v{position:relative;padding-top:10px}
.kpi.hero .v::before{content:"";position:absolute;top:0;left:0;width:34px;height:4px;background:var(--red)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.neu{background:var(--surface-2);color:var(--fg-2)}
.strip{display:flex;gap:28px;flex-wrap:wrap;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);align-items:center}
.strip .it{display:flex;flex-direction:column;gap:2px}
.strip .it b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.strip .it span{font-size:11px;color:var(--fg-3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.strip .bar{flex:1;min-width:200px}
.bigbar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.bigbar i{display:block;height:100%;background:var(--red);border-radius:999px}

.chart-box{position:relative;height:300px}
.chart-box.tall{height:380px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--fg-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.seg.small button{font-size:11.5px;padding:4px 8px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap;position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--fg)}
th .arr{color:var(--red)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--surface-2)}
.pname{font-weight:600;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--fg-3)}
.prog{display:flex;align-items:center;gap:8px;min-width:150px}
.prog .t{flex:1;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog .t i{display:block;height:100%;background:var(--fg);border-radius:999px}
.prog .t i.full{background:var(--good)}
.prog b{font-size:12px;width:38px;text-align:right}
select.pm{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px;font-size:12.5px;max-width:170px}
select.pm.unset{color:var(--fg-3);border-style:dashed}
tfoot td{font-weight:800;border-top:2px solid var(--fg);background:var(--surface-2)}

/* PMs */
.pm-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.pm-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.pm-card .top{display:flex;align-items:center;gap:10px}
.pm-card .avatar{background:var(--ink);width:36px;height:36px;font-size:13px}
.pm-card .nm{font-weight:700;font-size:15px}
.pm-card .meta{font-size:12px;color:var(--fg-3)}
.pm-card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pm-card .stats div{display:flex;flex-direction:column;gap:1px}
.pm-card .stats b{font-size:15px}
.pm-card .stats span{font-size:10.5px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--fg-2);font-weight:600}
.pm-card.unassigned{border-style:dashed}
.addpm{display:flex;gap:8px;flex-wrap:wrap}
.addpm input{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;background:var(--ink);color:#fff}
.btn.red{background:var(--red)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.roster{display:flex;gap:6px;flex-wrap:wrap}
.roster .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;font-size:12.5px}
.roster .tag button{border:0;background:none;color:var(--fg-3);padding:0 4px;font-size:15px;line-height:1}
.roster .tag button:hover{color:var(--bad)}

/* sheet */
.sheet td,.sheet th{padding:7px 10px;font-size:12.5px}
.sheet th.mo{text-align:right}
.sheet td.cell{text-align:right}
.sheet td.cell .p{display:block;color:var(--fg-3);font-size:11px}
.sheet td.cell.cur{background:var(--red-soft)}
.sheet .stick{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
.sheet thead .stick{z-index:2}
.sheet tfoot .stick{background:var(--surface-2)}
.cell.over{color:var(--good);font-weight:700}.cell.under{color:var(--bad);font-weight:700}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:var(--bg);z-index:51;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:14px;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.drawer h3{margin:0;font-size:20px;letter-spacing:-.02em}
.x{border:0;background:var(--surface-2);border-radius:8px;width:34px;height:34px;font-size:18px}

/* slides */
.stage{display:flex;flex-direction:column;gap:12px}
.slide-frame{aspect-ratio:16/9;width:100%;max-width:100%;background:var(--ink);color:#fff;border-radius:14px;overflow:hidden;position:relative}
.slide-frame:fullscreen{border-radius:0}
.slide{position:absolute;inset:0;padding:4.2% 5%;display:flex;flex-direction:column;gap:2.4%;font-size:clamp(9px,1.45vw,22px)}
.slide-frame:fullscreen .slide{font-size:1.45vw}
.slide .s-top{display:flex;justify-content:space-between;align-items:center}
.slide .s-top img{height:1.6em}
.slide .s-top span{font-size:.7em;color:#8FA0A3;letter-spacing:.1em;text-transform:uppercase}
.slide h4{margin:0;font-size:2em;letter-spacing:-.02em;line-height:1.1;font-weight:800}
.slide h4::before{content:"";display:block;width:2.2em;height:.18em;background:var(--red);margin-bottom:.45em}
.slide .lead{color:#AFC0C3;font-size:.85em}
.slide .s-body{flex:1;min-height:0;position:relative}
.s-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2em;height:100%}
.s-kpi{background:#141B1D;border-radius:.6em;padding:1em 1.1em;display:flex;flex-direction:column;justify-content:space-between}
.s-kpi span{font-size:.7em;color:#8FA0A3;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.s-kpi b{font-size:2.2em;letter-spacing:-.02em}
.s-kpi em{font-style:normal;font-size:.75em;color:#C9D3D5}
.cover{justify-content:center;background:radial-gradient(120% 120% at 100% 0%,#0A4250 0%,#04191E 40%,#000 75%)}
.cover h1{font-size:3.4em;margin:0;letter-spacing:-.03em;line-height:1.02}
.cover img{height:2.4em;align-self:flex-start;margin-bottom:1.6em}
.cover p{color:#AFC0C3;margin:.5em 0 0;font-size:1em}
.s-list{display:grid;gap:.45em;font-size:.8em}
.s-row{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,4fr) 4.5em;gap:.8em;align-items:center}
.s-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-row .t{height:.55em;background:#1E2A2D;border-radius:9px;overflow:hidden}
.s-row .t i{display:block;height:100%;background:var(--red)}
.s-row b{text-align:right}
.slide-nav{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots button{width:28px;height:6px;border-radius:9px;border:0;background:var(--line);padding:0}
.dots button[aria-current="true"]{background:var(--red)}

.empty{padding:60px 20px;text-align:center;color:var(--fg-2);display:grid;gap:8px;justify-items:center}
.empty b{font-size:17px;color:var(--fg)}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sk 1.4s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.foot{font-size:12px;color:var(--fg-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:6px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3)}
@media (max-width:640px){
  .hide-sm{display:none}
  .mast .title{border:0;padding:0}
  .kpi .v{font-size:22px}
  .slicers{position:static}
  .reset{margin-left:0}
}

/* login */
.gate{position:fixed;inset:0;z-index:100;background:radial-gradient(110% 90% at 85% 0%,#0B3A45 0%,#03161B 45%,#000 80%);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate form{width:min(380px,100%);display:grid;gap:14px;color:#fff}
.gate img{height:34px;justify-self:start;margin-bottom:10px}
.gate h1{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:800}
.gate h1::before{content:"";display:block;width:40px;height:4px;background:#FF0000;margin-bottom:14px}
.gate p{margin:0 0 6px;color:#9AA9AC;font-size:13px}
.gate label{display:grid;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9AA9AC}
.gate input[type=text],.gate input[type=password]{background:#0E1A1D;border:1px solid #23363B;border-radius:9px;padding:12px 13px;color:#fff;font-size:15px;text-transform:none;letter-spacing:0}
.gate input:focus{outline:none;border-color:#FF0000}
.gate .rem{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:#C9D3D5}
.gate .rem input{accent-color:#FF0000;width:16px;height:16px}
.gate button{background:#FF0000;color:#fff;border:0;border-radius:9px;padding:12px;font-weight:800;font-size:15px}
.gate button:disabled{opacity:.6}
.gate .err{color:#FF8A8A;font-size:13px;min-height:18px}
.rbtn{display:inline-flex;align-items:center;gap:6px;background:#1C2629;color:#fff;border:0;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.rbtn:hover{background:#26343A}.rbtn:disabled{opacity:.7;cursor:progress}
.rbtn svg{flex:none}.rbtn.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rbtn.spin svg{animation:none}}
.who .link{color:#9AA9AC}.who .link:hover{color:#fff}

.sheet tr.sec td{background:var(--surface-2);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}

.sheet td.cell.exp{color:var(--fg-3);font-style:italic}

.mods button[aria-pressed="true"] .badge{background:#fff;color:#FF0000}
.fd-top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.fd-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fdk{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 16px;text-align:left;color:var(--fg)}
.fdk b{font-size:26px;font-weight:800;letter-spacing:-.02em}.fdk span{font-size:12px;color:var(--fg-2);font-weight:600}
.fdk.bad{border-left-color:var(--bad)}.fdk.warn{border-left-color:var(--warn)}.fdk.neu{border-left-color:var(--fg-3)}

.fd-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fd-ctl select,.fd-ctl input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;max-width:100%}
.fd-list{display:grid;gap:10px}
.fd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;min-width:0}
.fd.bad{box-shadow:inset 3px 0 0 var(--bad)}.fd.warn{box-shadow:inset 3px 0 0 var(--warn)}.fd.neu{box-shadow:inset 3px 0 0 var(--fg-3)}
.fd-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.fd-area{color:var(--fg-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
.fd-proj{font-weight:700;font-size:13px}

.fd-where{font-size:12px;color:var(--fg-2)}.fd-where span{font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;margin-right:8px}

.tedit{border:1px dashed var(--line);background:none;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;color:var(--fg-2)}

.stsel.st-active{color:var(--good);border-color:var(--good)}.stsel.st-completed{color:var(--fg-2)}.stsel.st-paused{color:var(--warn);border-color:var(--warn)}.stsel.st-terminated{color:var(--bad);border-color:var(--bad)}.stsel.st-none{color:var(--fg-3);border-style:dashed}

.tinput.tname{font-weight:700;min-width:150px}

.avatar.sm{width:26px;height:26px;font-size:11px;background:var(--ink)}

.ed-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}

.ed-row input[list]{flex:1}.ed-pct{display:flex;align-items:center;gap:4px}.ed-pct input{width:76px}
.ed-foot{display:flex;justify-content:space-between;align-items:center}

.rp-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px}

.rp-item{display:flex;justify-content:space-between;gap:8px;align-items:center;border:0;background:none;text-align:left;padding:7px 8px;border-radius:7px;font-size:13px;color:var(--fg)}
.rp-item:hover{background:var(--surface-2)}.rp-item.on{background:var(--ink);color:#fff}

.toplist .row b{text-align:right}

.rank .row .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rank .row .n span{font-size:11.5px;color:var(--fg-3)}
.rank .row .t{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}.rank .row .t i{display:block;height:100%;background:var(--red);border-radius:9px}

.avatar.lg{width:38px;height:38px;font-size:13px;background:var(--ink)}
.wlist{display:flex;flex-wrap:wrap;gap:4px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st.ap{background:var(--good-bg);color:var(--good)}.st.rt{background:var(--bad-bg);color:var(--bad)}.st.ir{background:var(--warn-bg);color:var(--warn)}.st.ip{background:var(--surface-2);color:var(--fg)}.st.ns{background:var(--surface-2);color:var(--fg-3)}
.heat td.h{text-align:center;font-weight:700;min-width:44px}
.desc{max-width:340px;white-space:normal;min-width:220px;color:var(--fg-2)}
td.wrapc{white-space:normal;min-width:180px}
.age.old{color:var(--bad);font-weight:700}
.seg button .c{color:var(--fg-3);font-weight:600;margin-left:3px}
.empty-sm{padding:24px;text-align:center;color:var(--fg-3);font-size:13px}
.kpi .v small{font-size:14px;color:var(--fg-3);font-weight:700;margin-left:2px}

.legend i.ln{height:3px;border-radius:2px;vertical-align:3px}
.ctl .seg{flex-wrap:wrap}
.ctl{min-width:0;max-width:100%}

const nm=s=>`<span class="${isAr(s)?"ar":""}" dir="auto">${esc(s)}</span>`;
const fmtN=v=>v==null||isNaN(v)?"—":Math.round(v).toLocaleString("en-US");
const fmt1=v=>v==null||isNaN(v)?"—":(Math.round(v*10)/10).toLocaleString("en-US");
const pct=v=>v==null||!isFinite(v)?"—":Math.round(v*100)+"%";

const isoLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

const fD=s=>{if(!s)return "—";const [y,m,d]=s.split("-");return `${+d} ${MON[+m-1]} ${y}`};
const relTime=d=>{const m=Math.round((Date.now()-d)/60000);if(m<1)return"just now";if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<48)return h+" h ago";return Math.round(h/24)+" days ago"};

/* ---------- state ---------- */

const S={d:null,status:null,token:"",user:"",view:"overview",year:"all",months:new Set(),
  f:{project:new Set(),type:new Set(),team:new Set(),reviewer:new Set(),stage:new Set(),severity:new Set()},

let STG=[],TEAM_OF={},TEAMS=[],C=[],CK=new Map(),L=[],SEVS=["Critical","Major","Minor"],ALERTS=[];
const NI="Not included";
function courseStatus(c){
  const sc=c.inScope.length,ap=c.ap;
  if(!sc)return "Scope not set";if(ap===sc)return "All approved";
  const v=c.inScope.map(s=>c.stages[s]);
  if(v.includes("Returned"))return "Returned for edits";if(v.includes("In Review"))return "In review";
  return c.inScope.some(s=>c.stages[s]==="Approved"||c.stages[s]==="Returned")||!NEWMODE?"In progress":"Not started";
}
function build(){
  const D=S.d;
  STG=D.stages.map(s=>s.name);TEAM_OF=Object.fromEntries(D.stages.map(s=>[s.name,s.team]));
  TEAMS=uniq([...D.teams,...D.stages.map(s=>s.team)].filter(Boolean));
  if(D.severity?.length)SEVS=D.severity.map(s=>s.name);
  C=D.courses.map(c=>{const key=`${c.project} | ${c.course}`;const inScope=STG.filter(s=>c.stages[s]&&c.stages[s]!==NI);
    const o={...c,key,inScope,ap:inScope.filter(s=>c.stages[s]==="Approved").length};o.prog=inScope.length?o.ap/inScope.length:null;o.status=courseStatus(o);return o});
  CK=new Map();C.forEach(c=>{if(!CK.has(c.key))CK.set(c.key,c)});
  NEWMODE=!!D.hasResult;
  const RAW=D.log.map(x=>{const c=CK.get(x.course);const parts=x.course.split(" | ");
    const o={...x,c,project:c?c.project:(parts.length>1?parts[0]:""),courseName:c?c.course:(parts.length>1?parts.slice(1).join(" | "):x.course),
      type:c?c.type:"",team:TEAM_OF[x.stage]||"",id:"QA-"+String(x.row-4).padStart(4,"0"),d:dnum(x.date),fx:dnum(x.fixed),open:x.status!=="Done"};
    o.passed=NEWMODE&&/^pass/i.test(x.result||"");if(o.passed)o.open=false;
    o.age=o.open&&o.d!=null?TD-o.d:null;o.fixDays=o.d!=null&&o.fx!=null?o.fx-o.d:null;return o});
  L=RAW.filter(x=>!x.passed);PASSES=RAW.filter(x=>x.passed);ROWS=RAW;
  if(NEWMODE){ // stage status comes from the latest review round in the log
    for(const c of C){for(const s of STG){if(c.stages[s]===NI)continue;const rr=RAW.filter(x=>x.c===c&&x.stage===s);
      if(!rr.length){c.stages[s]="Not Started";continue}const mx=Math.max(...rr.map(x=>x.round||1));
      c.stages[s]=rr.some(x=>!x.passed&&(x.round||1)===mx)?"Returned":"Approved"}
      c.inScope=STG.filter(s=>c.stages[s]&&c.stages[s]!==NI);c.ap=c.inScope.filter(s=>c.stages[s]==="Approved").length;c.prog=c.inScope.length?c.ap/c.inScope.length:null;c.status=courseStatus(c)}}
  const order=L.filter(x=>x.d!=null&&x.team&&x.category).sort((a,b)=>a.d-b.d||a.row-b.row);const cnt=new Map();
  for(const x of order){const k=x.team+"\u0001"+x.category;const n=(cnt.get(k)||0)+1;cnt.set(k,n);x.occ=n}
  for(const x of L){x.auto=x.occ?(x.occ>1?"Yes":"No"):"";const ov=/^(yes|no)$/i.test(x.override)?x.override[0].toUpperCase()+x.override.slice(1).toLowerCase():"";
    x.ov=ov;x.final=ov||x.auto;x.rep=x.final==="Yes"}
  // stage results: every course x in-scope stage is one QA review unit
  SR=[];for(const c of C)for(const s of STG){const v=c.stages[s]||"";if(!v||v===NI)continue;const iss=L.filter(x=>x.c===c&&x.stage===s);
    const rev=NEWMODE?ROWS.some(x=>x.c===c&&x.stage===s):v==="Approved"||v==="Returned"||iss.length>0,ret=rev&&(iss.length>0||(!NEWMODE&&v==="Returned"));
    SR.push({c,course:c.key,project:c.project,type:c.type,reviewer:c.reviewer,stage:s,team:TEAM_OF[s]||"",status:v,n:iss.length,rev,ret,
      rounds:ret?Math.max(1,...iss.map(x=>x.round||1)):null,open:iss.filter(x=>x.open).length})}
  ALERTS=buildAlerts();
}
let SR=[],PASSES=[],ROWS=[],NEWMODE=false;
function fSR(o={}){const f=S.f;return SR.filter(r=>(!f.project.size||f.project.has(r.project))&&(!f.type.size||f.type.has(r.type))&&(!f.reviewer.size||f.reviewer.has(r.reviewer))&&
  (!f.team.size||f.team.has(r.team))&&(!f.stage.size||f.stage.has(r.stage))&&(!o.extra||o.extra(r)))}
const ir=R=>{const rv=R.filter(r=>r.rev),rt=rv.filter(r=>r.ret);return {rev:rv.length,ret:rt.length,pass:rv.length-rt.length,rate:rv.length?rt.length/rv.length:null,
  rounds:rt.length?rt.reduce((s,r)=>s+r.rounds,0)/rt.length:null}};
const rateCol=v=>v==null?css("--planned"):v>=.5?css("--bad"):v>=.3?"#F2A93B":css("--good");
const rateTag=(v,o)=>v==null?'<span class="muted">—</span>':`<b style="color:${rateCol(v)}">${pct(v)}</b>${o?` <span class="muted" style="font-size:11.5px">${o.ret}/${o.rev}</span>`:""}`;
const inPeriod=x=>{if(S.year==="all"&&!S.months.size)return true;if(!x.date)return false;return (S.year==="all"||x.date.startsWith(S.year))&&(!S.months.size||S.months.has(+x.date.slice(5,7)))};
const periodOn=()=>S.year!=="all"||S.months.size>0;
function fLog(o={}){const f=S.f;return L.filter(x=>(o.noPeriod||inPeriod(x))&&(!f.project.size||f.project.has(x.project))&&(!f.type.size||f.type.has(x.type))&&
  (!f.team.size||f.team.has(x.team))&&(!f.reviewer.size||f.reviewer.has(x.reviewer))&&(!f.stage.size||f.stage.has(x.stage))&&(!f.severity.size||f.severity.has(x.severity))&&(!o.extra||o.extra(x)))}
function fCourses(){const f=S.f;return C.filter(c=>(!f.project.size||f.project.has(c.project))&&(!f.type.size||f.type.has(c.type))&&(!f.reviewer.size||f.reviewer.has(c.reviewer))&&
  (!f.team.size||c.inScope.some(s=>f.team.has(TEAM_OF[s])))&&(!f.stage.size||c.inScope.some(s=>f.stage.has(s))))}
const stats=X=>{const t=X.length,fx=X.filter(x=>x.fixDays!=null&&!x.open);return {t,crit:X.filter(x=>x.severity==="Critical").length,maj:X.filter(x=>x.severity==="Major").length,
  min:X.filter(x=>x.severity==="Minor").length,rep:X.filter(x=>x.rep).length,open:X.filter(x=>x.open).length,r2:X.filter(x=>(x.round||1)>=2).length,
  fix:fx.length?fx.reduce((s,x)=>s+x.fixDays,0)/fx.length:null,old:X.filter(x=>x.open&&x.age>OLD).length,rr:t?X.filter(x=>x.rep).length/t:null}};

/* ---------- alerts (data checks + things to chase) ---------- */
const ASEV={bad:{l:"Act now",o:0},warn:{l:"Needs attention",o:1},info:{l:"For information",o:2}};
function buildAlerts(){
  const out=[];const add=(sev,area,project,title,detail,where,team="")=>out.push({sev,area,project,title,detail,where,team});
  const catOK=(s,c)=>{const l=S.d.categories?.[s];return !l||!l.length||l.includes(c)};
  for(const x of L){const w=`Issue Log → row ${x.row} (${x.id})`;const lab=`${x.courseName||x.course||"?"} · ${x.stage||"?"}`;
    if(x.open&&x.severity==="Critical")add("bad","Open issues",x.project,`Critical issue still ${x.status==="In Progress"?"in progress":"open"}${x.age!=null?" after "+x.age+" day"+(x.age===1?"":"s"):""}`,`${lab}: ${x.category}${x.desc?" — “"+x.desc+"”":""}.`,w,x.team);
    else if(x.open&&x.age>OLD)add("warn","Open issues",x.project,`Open for ${x.age} days`,`${lab}: ${x.category} (${x.severity||"no severity"}), status ${x.status||"empty"}.`,w,x.team);
    if(x.status==="Done"&&!x.fixed)add("warn","Data quality",x.project,"Marked Done without a fix date","Days to fix can't be worked out for this issue.",w+", Date fixed",x.team);
    if(x.d!=null&&x.fx!=null&&x.fx<x.d)add("bad","Data quality",x.project,"Fix date is before the date logged",`Logged ${fD(x.date)}, fixed ${fD(x.fixed)}.`,w,x.team);
    if(x.course&&!x.c)add("warn","Data quality",x.project,"Course not found on the Courses tab",`“${x.course}” isn't a course key on the Courses tab, so project and type are guessed from the name.`,w+", Course",x.team);
    if(x.c&&x.stage&&(x.c.stages[x.stage]===NI))add("warn","Data quality",x.project,"Issue logged on a stage the course doesn't include",`${x.courseName}: ${x.stage} is marked “Not included” on the Courses tab.`,`${w} and Courses → row ${x.c.row}`,x.team);
    const miss=[!x.date&&"date logged",!x.stage&&"stage",!x.category&&"issue category",!x.severity&&"severity",!x.status&&"status",!x.course&&"course"].filter(Boolean);
    if(miss.length)add("warn","Data quality",x.project,`Missing ${miss.join(", ")}`,"This row can't be counted fully until it's filled in.",w,x.team);
    if(x.category&&x.stage&&!catOK(x.stage,x.category))add("info","Data quality",x.project,"Category isn't in the list for this stage",`“${x.category}” isn't listed under ${x.stage} on the Lists tab.`,w,x.team);
    if(x.ov&&x.auto&&x.ov!==x.auto)add("info","QA overrides",x.project,`Repeated set to ${x.ov} by QA (automatic: ${x.auto})`,`${lab}: ${x.category}.`,w+", Repeated (override)",x.team);
  }
  for(const x of PASSES){const w=`Issue Log → row ${x.row} (${x.id})`;
    const miss=[!x.date&&"date",!x.course&&"course",!x.stage&&"stage",!x.round&&"review round"].filter(Boolean);
    if(miss.length)add("warn","Data quality",x.project,`Passed review missing ${miss.join(", ")}`,"Fill it in so the stage is counted correctly.",w,x.team);
    if(x.category||x.severity)add("warn","Data quality",x.project,"Passed row has issue details","A Passed row means no issues. Change Result to Returned, or clear the issue columns.",w,x.team);
    if(x.course&&!x.c)add("warn","Data quality",x.project,"Course not found on the Courses tab",`“${x.course}” isn't a course key on the Courses tab.`,w+", Course",x.team)}
  if(NEWMODE)for(const x of L)if(!x.round)add("warn","Data quality",x.project,"Missing review round","Without the round the stage status and rounds of edits can't be worked out.",`Issue Log → row ${x.row} (${x.id})`,x.team);
  const seen=new Map();
  for(const c of C){const w=`Courses → row ${c.row}`;
    if(seen.has(c.key))add("warn","Data quality",c.project,"Course listed twice",`“${c.course}” appears in rows ${seen.get(c.key)} and ${c.row}. Issues are matched to the first one.`,w);else seen.set(c.key,c.row);
    if(!c.reviewer)add("info","Courses",c.project,"No QA reviewer assigned",`${c.course}.`,w+", QA reviewer");
    if(!c.inScope.length)add("info","Courses",c.project,"Stages not set",`${c.course}: every stage is empty or Not included.`,w);
    for(const s of c.inScope){const op=L.filter(x=>x.c===c&&x.stage===s&&x.open);if(c.stages[s]==="Approved"&&op.length)add("warn","Courses",c.project,`${s} is Approved but has ${op.length} open issue${op.length>1?"s":""}`,`${c.course}: ${op.map(x=>x.id).join(", ")} still ${op.length>1?"aren't":"isn't"} Done.`,w+", "+s,TEAM_OF[s])}
    if(!c.project)add("warn","Data quality","","Course without a project",`${c.course}.`,w+", Project");
  }
  return out.sort((a,b)=>ASEV[a.sev].o-ASEV[b.sev].o);
}

  const areas=uniq(ALERTS.map(a=>a.area));const q=S.aq.toLowerCase();

  const [t,cat]=k.split("\u0001");const X=L.filter(x=>x.team===t&&x.category===cat).sort((a,b)=>(a.d??1e9)-(b.d??1e9)||a.row-b.row);
  drawer(`${esc(t)} · ${X.length} time${X.length>1?"s":""} on ${uniq(X.map(x=>x.course)).length} course(s), all time`,cat,`
  <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Logged</th><th>Project · course</th><th>Stage</th><th>Severity</th><th>Status</th><th>Repeated</th></tr></thead><tbody>${X.map(x=>`<tr class="click" data-err="${x.row}"><td><b>${x.occ||"—"}</b></td><td>${fD(x.date)}</td><td>${nm(x.project)}<div class="muted" style="font-size:11.5px">${nm(x.courseName)}</div></td><td>${esc(x.stage)}</td><td>${sevTag(x.severity)}</td><td>${esc(x.status)}</td><td>${repTag(x)||'<span class="muted">First time</span>'}</td></tr>`).join("")}</tbody></table></div>
  <p class="muted" style="margin:0;font-size:12px"># is the occurrence number for this team and category, by date logged. 1 = first time, so not a repeat.</p>`);
}
function openErr(row){
  const x=L.find(e=>e.row===+row);if(!x)return;
  drawer(`${x.id} · ${esc(x.project)} · logged ${fD(x.date)} by ${esc(x.reviewer||"—")}`,x.category||"Issue",`
  <div class="kpis">${kpi("Severity",sevTag(x.severity),SEVS.length&&S.d.severity?.find(s=>s.name===x.severity)?.desc?.slice(0,90)||"")}${kpi("Status",esc(x.status||"—"),x.open?(x.age!=null?`${x.age} days open`:""):(x.fixDays!=null?`fixed in ${x.fixDays} days`:"no fix date"))}${kpi("Repeated",esc(x.final||"—"),x.ov?`Set by QA · automatic: ${esc(x.auto||"—")}`:x.occ?`Occurrence #${x.occ} for ${esc(x.team)}`:"")}</div>
  <div class="card"><div class="tbl-wrap" style="border:0"><table><tbody>
   ${[["Course",nm(x.courseName)],["Project",nm(x.project)+(x.type?` · ${esc(x.type)}`:"")],["Stage",esc(x.stage)],["Responsible team",teamTag(x.team)],["Description",`<span style="white-space:normal">${esc(x.desc||"—")}</span>`],["Review round",x.round??"—"],["Date fixed",fD(x.fixed)],["Notes",`<span style="white-space:normal">${esc(x.notes||"—")}</span>`],["In the sheet",`Issue Log → row ${x.row}`]].map(([a,b])=>`<tr><th style="position:static;width:150px">${a}</th><td style="white-space:normal">${b}</td></tr>`).join("")}
  </tbody></table></div></div>${x.team&&x.category?`<button class="btn ghost" data-pat="${esc(x.team+"\u0001"+x.category)}">See every “${esc(x.category)}” for ${esc(x.team)}</button>`:""}`);
}
function openRev(r){
  const cs=C.filter(c=>c.reviewer===r),X=L.filter(x=>x.reviewer===r);
  drawer(`${cs.length} courses · ${uniq(cs.map(c=>c.project)).length} projects · ${X.length} issues logged (all time)`,r,`
  <div class="tbl-wrap"><table><thead><tr><th>Course</th><th>Project</th><th>Stages</th><th>Status</th><th class="r">Open</th></tr></thead><tbody>${cs.map(c=>`<tr class="click" data-course="${esc(c.key)}"><td class="pname">${nm(c.course)}</td><td>${nm(c.project)}</td><td>${pipe(c)}</td><td>${stChip(c.status)}</td><td class="r num">${L.filter(x=>x.c===c&&x.open).length}</td></tr>`).join("")||'<tr><td colspan="5" class="empty-sm">No courses assigned</td></tr>'}</tbody></table></div>
  ${X.length?`<h3 style="margin:4px 0 0;font-size:15px">Issues logged</h3>${errTable("t-drv",X,100)}`:""}`);
}
function closeDrawer(){$("#drawerHost").innerHTML="";if(charts["c-dp"]){charts["c-dp"].destroy();delete charts["c-dp"]}}

/* ---------- slicers, sync bar, render ---------- */
const OPEN={id:null,q:""};
function renderSlicers(){
  const ys=uniq(L.filter(x=>x.date).map(x=>x.date.slice(0,4))).sort();
  $("#years").innerHTML=["all",...ys].map(y=>`<button data-y="${y}" aria-pressed="${S.year===y}">${y==="all"?"All":y}</button>`).join("");
  const cy=S.year===String(now.getFullYear());
  $("#months").innerHTML=MON.map((m,i)=>`<button data-m="${i+1}" aria-pressed="${S.months.has(i+1)}" class="${cy&&i===now.getMonth()?"cur":""}">${m}</button>`).join("");
  const o={project:uniq([...C.map(c=>c.project),...L.map(x=>x.project)]).filter(Boolean).sort(),type:uniq(C.map(c=>c.type).filter(Boolean)).sort(),team:TEAMS,
    reviewer:reviewersAll(),stage:STG,severity:SEVS};
  const lab={project:"Projects",type:"Types",team:"Teams",reviewer:"QA reviewers",stage:"Stages",severity:"Severities"};
  const caret='<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" stroke="currentColor" fill="none" stroke-width="1.6"/></svg>';
  $("#msHost").innerHTML=Object.keys(o).map(k=>{const sel=S.f[k];const lw=lab[k].replace(/^(?!QA)\w/,c=>c.toLowerCase());const v=!sel.size?"All "+lw:sel.size===1?[...sel][0]:`${sel.size} ${lw}`;
    return `<div class="ms" data-ms="${k}"><button type="button" class="${sel.size?"on":""}" aria-expanded="${OPEN.id===k}"><span class="v ${isAr(v)?"ar":""}">${esc(v)}</span>${caret}</button>
    ${OPEN.id===k?`<div class="pop" role="dialog" aria-label="${lab[k]}"><input type="search" placeholder="Search ${lw}" id="mss-${k}" value="${esc(OPEN.q)}"><div class="list">${o[k].filter(n=>!OPEN.q||n.toLowerCase().includes(OPEN.q.toLowerCase())).map(n=>`<label><input type="checkbox" data-f="${k}" value="${esc(n)}" ${sel.has(n)?"checked":""}><span class="${isAr(n)?"ar":""}" dir="auto">${esc(n)}</span></label>`).join("")||'<div class="muted" style="padding:8px">No matches</div>'}</div>
    <div class="acts"><button class="link" data-clear="${k}">Clear</button><button class="link" data-close>Done</button></div></div>`:""}</div>`}).join("");
  if(OPEN.id&&OPEN.focus){const i=document.getElementById("mss-"+OPEN.id);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  $("#reset").hidden=!(S.months.size||S.year!=="all"||Object.values(S.f).some(s=>s.size));
}
const reviewersAll=()=>uniq([...S.d.reviewers,...C.map(c=>c.reviewer),...L.map(x=>x.reviewer)].filter(Boolean));
function renderSync(){
  const st=S.status||{};const checked=new Date(st.checkedAt||S.d.parsedAt);const age=(Date.now()-checked)/36e5;let pill;
  if(S.busy)pill=`<span class="pill stale"><span class="dot"></span>${esc(S.busyMsg||"Working…")}</span>`;
  else if(st.ok===false)pill=`<span class="pill off" title="${esc(st.message||"")}"><span class="dot"></span>Last refresh failed ${relTime(checked)} · showing data from ${fmtDT(new Date(S.d.parsedAt))}</span>`;
  else pill=`<span class="pill ${age<1.6?"live":age<6?"stale":"off"}"><span class="dot"></span>${age<1.6?"Live · ":""}Last refresh ${fmtDT(checked)} (${relTime(checked)})</span>`;
  $("#sync").innerHTML=pill+(S.d.sourceModified?` <span class="hide-sm">Excel edited ${fmtDT(new Date(S.d.sourceModified))}</span>`:"");
  const b=$("#refresh");b.disabled=!!S.busy;b.classList.toggle("spin",!!S.busy);
}
function render(){
  if(!S.d)return;
  $(".slicers").hidden=false;renderSlicers();renderSync();
  $$(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===S.view));
  VIEWS.forEach(v=>$("#v-"+v).hidden=v!==S.view);$("#loading").hidden=true;
  const n=ALERTS.filter(a=>a.sev==="bad").length;$("#abadge").textContent=n;$("#abadge").hidden=!n;
  ({overview:renderOverview,teams:renderTeams,repeated:renderRepeated,projects:renderProjects,courses:renderCourses,qa:renderQA,log:renderLog,alerts:renderAlerts})[S.view]();
  const st=S.status||{};
  $("#foot").innerHTML=`<span>Source: Quality Tracking sheet (Courses, Issue Log, Lists) · refreshes automatically every hour${st.ok===false?` · <b style="color:var(--bad)">Last refresh failed: ${esc(st.message)}</b>`:""}</span><span>${C.length} courses · ${L.length} issues logged</span>`;
}
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target;
  const tab=t.closest(".tab");if(tab){S.view=tab.dataset.v;try{localStorage.setItem("qa.view",S.view)}catch(e){}history.replaceState(null,"","#"+S.view);render();window.scrollTo({top:0});return}
  const msb=t.closest(".ms>button");if(msb){const k=msb.parentElement.dataset.ms;OPEN.id=OPEN.id===k?null:k;OPEN.q="";OPEN.focus=true;renderSlicers();return}
  if(t.closest("[data-close]")){OPEN.id=null;renderSlicers();return}
  const cl=t.closest("[data-clear]");if(cl){S.f[cl.dataset.clear].clear();render();return}
  if(OPEN.id&&!t.closest(".pop")){OPEN.id=null;renderSlicers()}
  if(t.closest("#reset")){S.year="all";S.months.clear();Object.values(S.f).forEach(s=>s.clear());render();return}
  const y=t.closest("[data-y]");if(y){S.year=y.dataset.y;render();return}
  const m=t.closest("#months [data-m]");if(m){const v=+m.dataset.m;S.months.has(v)?S.months.delete(v):S.months.add(v);render();return}
  const om=t.closest("#ovMode [data-m]");if(om){S.ovMode=om.dataset.m;render();return}
  const cs=t.closest("#cst [data-s]");if(cs){S.cst=cs.dataset.s;render();return}
  const lsb=t.closest("#lst [data-s]");if(lsb){S.lst=lsb.dataset.s;render();return}
  const as=t.closest("[data-asev]");if(as){S.asev=S.asev===as.dataset.asev?"":as.dataset.asev;render();return}
  if(t.closest("#lcsv")){exportLog();return}
  const th=t.closest("th[data-st]");if(th&&!t.closest(".drawer")){const id=th.dataset.st,k=th.dataset.k;const cur=S.sort[id];S.sort[id]=cur&&cur.k===k?{k,d:-cur.d}:{k,d:1};render();return}
  if(t.closest("[data-close-d]")){closeDrawer();return}
  const g=(a)=>t.closest(`[data-${a}]`);let e;
  if(e=g("course")){openCourse(e.dataset.course);return}
  if(e=g("proj")){openProject(e.dataset.proj);return}
  if(e=g("team")){openTeam(e.dataset.team);return}
  if(e=g("pat")){openPattern(e.dataset.pat);return}
  if(e=g("err")){openErr(e.dataset.err);return}
  if(e=g("rev")){openRev(e.dataset.rev);return}
});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.matches("[data-f]")){const s=S.f[t.dataset.f];t.checked?s.add(t.value):s.delete(t.value);OPEN.focus=false;render();return}
  if(t.id==="lrep"){S.lrep=t.checked;render();return}
  if(t.id==="aarea"){S.aarea=t.value;render();return}
});
const keepFocus=(id,fn)=>{fn();const i=document.getElementById(id);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}};
document.addEventListener("input",ev=>{const t=ev.target;
  if(t.id?.startsWith("mss-")){OPEN.q=t.value;OPEN.focus=true;renderSlicers();return}
  if(t.id==="cq"){S.cq=t.value;keepFocus("cq",renderCourses);return}
  if(t.id==="lq"){S.lq=t.value;keepFocus("lq",renderLog);return}
  if(t.id==="aq"){S.aq=t.value;keepFocus("aq",renderAlerts);return}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){if($("#drawerHost").innerHTML)closeDrawer();else if(OPEN.id){OPEN.id=null;renderSlicers()}}});

/* ---------- data, login, refresh ---------- */
let REPO="almentor-pmo/almentor-pmo.github.io";
const api=()=>"https://api.github.com/repos/"+REPO;
const LSK="almentor.qa.key";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ub64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
let DKEY=null;
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
async function sha256hex(t){const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}
async function getJSON(url,o={}){const r=await fetch(url,{cache:"no-store",...o});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function unlock(user,pass){
  const keys=await getJSON("keys.json?t="+Date.now());const ent=keys.users[await sha256hex("almentor-qa:"+user.trim().toLowerCase())];if(!ent)return null;
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const kek=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64(ent.salt),iterations:ent.iter},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  try{return await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ent.iv)},kek,b64(ent.wk))}catch(e){return null}
}
const decryptBundle=async b=>JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(b.iv)},DKEY,b64(b.ct))));
function ghHeaders(raw){const h={Accept:raw?"application/vnd.github.raw+json":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};if(S.token)h.Authorization="Bearer "+S.token;return h}
async function fetchBundle(fresh){if(fresh){try{return await getJSON(`${api()}/contents/quality/data.enc?ref=main&t=${Date.now()}`,{headers:ghHeaders(true)})}catch(e){}}return getJSON("data.enc?t="+Date.now())}
async function fetchStatus(fresh){if(fresh)return getJSON(`${api()}/contents/quality/status.json?ref=main&t=${Date.now()}`,{headers:ghHeaders(true)});return getJSON("status.json?t="+Date.now())}
async function loadBundle(fresh){
  const b=await decryptBundle(await fetchBundle(fresh));
  S.d=b.data;S.status=b.status;S.token=b.token||"";if(b.repo)REPO=b.repo;build();render();
}
async function refreshNow(){
  if(S.busy)return;if(!S.token){toast("Reloading the latest published data…");loadBundle(false).catch(()=>toast("Couldn't reach the dashboard data"));return}
  const rid=Math.random().toString(36).slice(2,10)+Date.now().toString(36);S.busy=true;S.busyMsg="Pulling latest from Excel…";renderSync();const t0=Date.now();let done=false;
  try{const r=await fetch(`${api()}/actions/workflows/qa-sync.yml/dispatches`,{method:"POST",headers:{...ghHeaders(false),"Content-Type":"application/json"},body:JSON.stringify({ref:"main",inputs:{request_id:rid}})});
    if(r.status!==204)throw new Error(r.status===401||r.status===403?"The Refresh token has expired or lacks permission":"GitHub answered "+r.status);
    while(Date.now()-t0<240000){await new Promise(r=>setTimeout(r,5000));S.busyMsg="Pulling latest from Excel… "+Math.round((Date.now()-t0)/1000)+"s";renderSync();
      try{const st=await fetchStatus(true);if(st.requestId===rid){done=true;break}}catch(e){}}
  }catch(e){S.busy=false;renderSync();toast(e.message);return}
  S.busy=false;try{await loadBundle(true)}catch(e){}
  toast(!done?"GitHub is taking longer than usual. The page will update when it finishes.":S.status?.ok===false?"Refresh finished with a problem: "+S.status.message:S.status?.message||"Up to date");renderSync();
}
function setMastH(){document.documentElement.style.setProperty("--mastH",$("#mast").offsetHeight+"px")}
addEventListener("resize",setMastH);setMastH();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(S.d)render()});
$("#refresh").addEventListener("click",refreshNow);
async function start(rawKey){
  DKEY=await crypto.subtle.importKey("raw",rawKey,"AES-GCM",false,["decrypt"]);$("#gate").hidden=true;
  $("#who").innerHTML=`<div class="avatar">${esc(initials(S.user||"QA"))}</div><span class="hide-sm">${esc(S.user||"")}</span><button class="link" id="signout" type="button">Sign out</button>`;
  $("#signout").onclick=()=>{ls.del(LSK);location.reload()};
  try{await loadBundle(false)}catch(e){if(String(e).includes("OperationError")){ls.del(LSK);location.reload();return}console.error(e);$("#loadmsg").textContent="Couldn't load the dashboard data. Check your connection and reload the page.";return}
  setMastH();
  setInterval(async()=>{if(S.busy||document.hidden)return;try{const st=await fetchStatus(false);if(st.checkedAt&&st.checkedAt!==S.status?.checkedAt)await loadBundle(false)}catch(e){}},5*60000);
  setInterval(()=>{if(S.d)renderSync()},60000);
}
$("#login").addEventListener("submit",async ev=>{ev.preventDefault();const u=$("#u").value,p=$("#pw").value;$("#lerr").textContent="";$("#lbtn").disabled=true;$("#lbtn").textContent="Signing in…";
  try{const k=await unlock(u,p);if(!k){$("#lerr").textContent="That username or password isn't right. Try again.";return}
    S.user=u.trim();if($("#keep").checked)ls.set(LSK,JSON.stringify({u:S.user,k:ub64(k)}));await start(k)}
  catch(e){$("#lerr").textContent="Couldn't reach the dashboard. Check your connection and try again."}
  finally{$("#lbtn").disabled=false;$("#lbtn").textContent="Sign in"}});
(async()=>{if(!window.crypto?.subtle){$("#loadmsg").textContent="This browser can't open the dashboard. Use a recent Chrome, Edge, Safari or Firefox.";return}
  const saved=ls.get(LSK);if(saved){try{const o=JSON.parse(saved);S.user=o.u;await start(b64(o.k));return}catch(e){ls.del(LSK)}}
  $("#gate").hidden=false;$("#u").focus()})();

</script>
